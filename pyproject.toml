[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-course-project"
version = "0.1.0"
description = "Reproducible credit-risk classification coursework project"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scikit-learn==1.9.1",
  "PyYAML==6.0.3",
  "joblib==1.6.0",
  "matplotlib==3.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]
